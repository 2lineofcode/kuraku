flutter_launcher_icons:
  # Shared Desktop icon; Linux installs it through tool/package_linux.sh.
  image_path: "assets/app_icon.png"
  android: false
  ios: false
  macos:
    generate: true
  windows:
    # Enable after adding the Windows runner.
    generate: false
    icon_size: 48 # min:48, max:256, default: 48
