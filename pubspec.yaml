name: javit
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  # core
  get: ^4.7.2
  get_storage: ^2.1.1
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2

  # dio
  dio: ^5.8.0+1
  dio_cache_interceptor: ^3.5.1
  dio_cache_interceptor_hive_store: ^4.0.0
  pretty_dio_logger: ^1.4.0
  dio_smart_retry: ^7.0.1

  # ui
  ex_kit: ^0.7.0
  cupertino_icons: ^1.0.8
  iconify_flutter_plus: ^1.0.4
  flutter_svg: ^2.0.17
  grouped_list: ^6.0.0
  window_manager: ^0.4.3
