name: javit
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+20261007.56

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  # ** core
  get: ^4.7.3
  get_secure_storage: ^1.0.5
  cryptography: ^2.9.0
  ffi: ^2.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqflite: ^2.4.4
  sql_formatter: ^0.1.0

  # ** player
  cached_video_player_plus: ^4.1.0
  video_player: ^2.14.1
  chewie: ^1.17.2
  audioplayers: ^6.8.1

  # mediakit
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  media_kit_libs_macos_video: ^1.1.4
  video_player_media_kit: ^2.0.0

  # dio
  dio: ^5.11.1
  dio_cache_interceptor: ^4.0.7
  http_cache_sembast_store: ^1.0.1

  # ** ui
  ex_kit: ^0.7.0
  cupertino_icons: ^2.0.0
  hugeicons: ^1.2.0
  window_manager: ^0.5.2
  flutter_popup: ^3.3.9
  flutter_colorpicker: ^1.1.0
  glassmorphism_ui: ^0.3.0
  overlayment: ^0.2.1
  cached_network_image: ^4.0.4
  flutter_cache_manager: ^3.4.5
  zoom_hover_pinch_image: ^1.1.0
  flutter_typeahead: ^6.0.0
  flutter_list_view: ^1.1.29
  timelines_plus: ^2.0.1
  dotted_border: ^3.1.0
  markdown_widget: ^2.3.2+8

  # ** utils
  file_picker: ^13.1.0
  intl: ^0.20.3
  uuid: ^4.6.0
  url_launcher: ^6.3.3
  super_drag_and_drop: ^0.9.1
  super_context_menu: ^0.9.1
  hotkey_manager: ^0.2.3
  toastification: ^3.2.0
  kana_kit: ^2.1.1
  process_run: ^1.3.7
  glob: ^2.2.0
  html: ^0.15.7
  ffmpeg_kit_flutter_new: ^4.6.4
  video_compress: ^3.1.4
  flutter_local_notifications: ^22.3.1
  translator: ^1.0.4+1

  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  enven: ^1.3.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  config:
    enable-macos-arm64-only: true
  uses-material-design: true
  assets:
    - assets/r18_database_importer.py
    - assets/r18_video_code_migration.sql
    - assets/r18_catalog_queries.sql
    - assets/visual_search_worker.py
    - assets/chat_database_worker.py
    - assets/sql_editor_worker.py
    - assets/javit_downloader
    - assets/download_complete.mp3

get_cli:
  sub_folder: false

dependency_overrides:
  # ex_kit 0.7.0 still constrains cached_network_image to 3.x.
  cached_network_image: ^4.0.4
  # chewie 1.17.2 still constrains the Cupertino icon font to 1.x.
  cupertino_icons: ^2.0.0
  # super_context_menu and super_native_extensions still constrain device_info_plus to <12.
  device_info_plus: ^13.3.0
  # flutter_local_notifications_linux still constrains dbus to 0.7.x.
  dbus: ^0.8.0
  # toastification still constrains Equatable to 2.x; it uses the retained class API.
  equatable: ^3.0.0
  # flutter_launcher_icons still constrains cli_util to 0.4.x.
  cli_util: ^0.6.0
  # vector_graphics_compiler still constrains xml to <=7.0.1.
  xml: ^7.1.0
