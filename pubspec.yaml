  toastification: ^3.0.3
  ffmpeg_kit_flutter_new: ^2.0.0
  video_compress: ^3.1.4            # ?
  kana_kit: ^2.1.1

  flutter:
    sdk: flutter

dev_dependencies:
  enven: ^1.2.1
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter

flutter:
