name: macOS CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Test release validation and architecture
        run: python3 -B test/macos_release_workflow_test.py

      - name: Validate version
        run: |
          version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+(\.[0-9]+)?)?$ ]] || {
            echo 'Invalid pubspec.yaml version' >&2
            exit 1
          }
          version="${version%%+*}"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match pubspec.yaml: v$version" >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install native dependencies
        run: brew install cocoapods libiconv ffmpeg

      - name: Prepare public environment
        run: |
          cp .env.sample .env
          flutter pub get --enforce-lockfile
          dart run enven

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build Apple Silicon app
        run: >-
          flutter build macos --release --no-pub --no-tree-shake-icons
          --build-name="$APP_VERSION" --build-number="$GITHUB_RUN_NUMBER"

      - name: Package DMG
        run: |
          app='build/macos/Build/Products/Release/KuraKu.app'
          codesign --verify --deep --strict "$app"
          xcrun lipo "$app/Contents/MacOS/KuraKu" -verify_arch arm64
          mkdir -p build/dmg dist
          ditto "$app" build/dmg/KuraKu.app
          ln -s /Applications build/dmg/Applications
          image="KuraKu-${APP_VERSION}-macos-arm64.dmg"
          hdiutil create -volname KuraKu -srcfolder build/dmg -ov -format UDZO "dist/$image"
          hdiutil verify "dist/$image"
          cd dist
          shasum -a 256 "$image" > "$image.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: KuraKu-macos-arm64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: KuraKu-macos-arm64
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check ./*.sha256
          cat > notes.md <<'EOF'
          Apple Silicon (ARM64) only. The bundled downloader requires macOS 26 or later. Download the DMG, open it, and drag KuraKu to Applications.

          This build has no Developer ID signing or Apple notarization. After attempting to open it, use System Settings > Privacy & Security > Open Anyway if you trust this release.

          Python 3 is required for database setup. The R18 database is downloaded on first run. Personal API keys are not included; AI replies and web search are unavailable in this build.
          EOF
          gh release create "$RELEASE_TAG" ./*.dmg ./*.sha256 \
            --verify-tag --title "KuraKu $RELEASE_TAG" --generate-notes --notes-file notes.md
