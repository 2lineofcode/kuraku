name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Test release validation and architecture
        run: python3 -B test/macos_release_workflow_test.py

      - name: Validate version
        run: |
          version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+(\.[0-9]+)?)?$ ]] || {
            echo 'Invalid pubspec.yaml version' >&2
            exit 1
          }
          version="${version%%+*}"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match pubspec.yaml: v$version" >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install native dependencies
        run: brew install cocoapods libiconv ffmpeg

      - name: Prepare public environment
        run: |
          cp .env.sample .env
          flutter pub get --enforce-lockfile
          dart run enven

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build Apple Silicon app
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: >-
          flutter build macos --release --no-pub
          --build-name="$APP_VERSION" --build-number="$GITHUB_RUN_NUMBER"

      - name: Package DMG
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          app='build/macos/Build/Products/Release/KuraKu.app'
          assets="$app/Contents/Frameworks/App.framework/Resources/flutter_assets/assets"
          test -f "$assets/bin/macos-arm64/kuraku"
          test ! -e "$assets/bin/linux-x64/kuraku"
          test ! -e "$assets/bin/windows-x64/kuraku.exe"
          codesign --verify --deep --strict "$app"
          xcrun lipo "$app/Contents/MacOS/KuraKu" -verify_arch arm64
          mkdir -p build/dmg dist
          ditto "$app" build/dmg/KuraKu.app
          ln -s /Applications build/dmg/Applications
          image="KuraKu-${APP_VERSION}-macos-arm64.dmg"
          hdiutil create -volname KuraKu -srcfolder build/dmg -ov -format UDZO "dist/$image"
          hdiutil verify "dist/$image"
          cd dist
          shasum -a 256 "$image" > "$image.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          name: KuraKu-macos-arm64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
