name: Linux x64 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          # Select distro libunwind headers instead of the runner's conflicting LLVM variant.
          sudo apt-get install -y libunwind-dev clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev \
            libkeybinder-3.0-dev libjson-glib-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good \
            libwebkit2gtk-4.1-dev libopencore-amrnb0 libvo-amrwbenc0 \
            python3-venv ffmpeg curl xvfb dbus-x11

      - name: Prepare public environment
        run: |
          cp .env.sample .env
          flutter pub get --enforce-lockfile
          dart run enven

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test Linux runtime and related regressions
        run: >-
          nice -n 10 flutter test --no-pub --concurrency=1
          test/app_data_path_test.dart test/linux_runtime_test.dart test/helper_media_test.dart test/helper_misc_test.dart test/bundled_assets_test.dart
          test/app_dependencies_test.dart test/app_startup_test.dart
          test/page_download_job_test.dart test/page_search_file_drag_test.dart test/local_video_selection_test.dart
          test/page_tools_large_files_test.dart test/page_tools_resolution_test.dart
          test/helper_opener_trailer_test.dart test/widget_download_method_test.dart
          test/search_shortcut_test.dart test/keyboard_shortcuts_test.dart
          test/page_search_selection_test.dart test/player_rotation_test.dart test/player_cupertino_controls_test.dart
          test/screenshot_viewer_test.dart test/player_seek_preview_test.dart

      - name: Test Makefile targets
        run: python3 -B test/publish_test.py

      - name: Build and package
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          flutter build linux --release --no-pub --no-tree-shake-icons
          bash tool/package_linux.sh

      - name: Check native file tracking and startup
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          clang++ -std=c++14 -Wall -Werror linux/runner/file_drag_test.cc \
            -Ilinux/flutter/ephemeral $(pkg-config --cflags --libs gtk+-3.0) \
            -Llinux/flutter/ephemeral -lflutter_linux_gtk \
            -Wl,-rpath,"$PWD/linux/flutter/ephemeral" -o /tmp/kuraku-file-drag-test
          /tmp/kuraku-file-drag-test
          rm /tmp/kuraku-file-drag-test
          python3 -B tool/linux_smoke_test.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          name: KuraKu-linux-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
